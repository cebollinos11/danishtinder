<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="description" content="Learn Danish vocabulary by swiping through flashcards.">
<title>Dansk</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div id="dk-root">
  <header class="dk-top">
    <div class="dk-brand"><span class="dk-flag"></span><span class="dk-brandname">Dansk</span></div>
    <nav class="dk-nav" id="dk-nav" style="display:none;">
      <button class="dk-tab is-on" data-view="study">Practice</button>
      <button class="dk-tab" data-view="words">Words</button>
      <button class="dk-tab" data-view="stats">Progress</button>
      <div class="dk-xpbadge" id="dk-xpbadge" title="XP"><span class="dk-xpbadge-star" aria-hidden="true">⭐</span><span id="dk-xpbadge-num">0</span></div>
      <button class="dk-langbtn" id="dk-langbtn" type="button">EN</button>
      <div class="dk-settingswrap">
        <button class="dk-settingsbtn" id="dk-settingsbtn" type="button" aria-haspopup="true" aria-expanded="false">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <circle cx="8" cy="8" r="2.3" stroke="currentColor" stroke-width="1.3"/>
            <path d="M8 1.6v1.6M8 12.8v1.6M14.4 8h-1.6M3.2 8H1.6M12.34 3.66l-1.13 1.13M4.79 11.21l-1.13 1.13M12.34 12.34l-1.13-1.13M4.79 4.79 3.66 3.66" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
          </svg>
        </button>
        <div class="dk-settingsmenu" id="dk-settingsmenu" hidden>
          <button class="dk-settingsmenu-item is-danger" id="dk-nukebtn" type="button">Delete all progress</button>
        </div>
      </div>
    </nav>
  </header>
  <main id="dk-view"><div class="dk-loading">Loading&hellip; / Завантаження&hellip;</div></main>
</div>

<script type="module" src="js/app.js"></script>

<!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "4c403dc6dd96449cbf022a552759ef1e"}'></script><!-- End Cloudflare Web Analytics -->

</body>
</html>
